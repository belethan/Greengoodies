security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:

        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        #  FIREWALL PRINCIPAL — authentification par SESSION
        main:
            pattern: ^/(?!api)   # Tout sauf /api/...
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app.login
                check_path: app.login
                username_parameter: email
                password_parameter: password
                default_target_path: app.principale
                enable_csrf: true

            logout:
                path: app.logout
                target: app.principale

            stateless: false

        # LOGIN JWT — route publique pour obtenir un token
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider

            # Si tu veux bloquer login si api_active = false, activer :
            # user_checker: App\Security\UserChecker

            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # FIREWALL API — sécurise *tout le reste des routes /api/*
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

            # Si tu veux vérifier api_active avant d'autoriser le token :
            # user_checker: App\Security\UserChecker

    access_control:
        # Route de login API (publique)
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        # ❗ La route toggle ne doit PAS passer par le firewall API — on la sort du /api/
        - { path: ^/user/api/activer$, roles: IS_AUTHENTICATED_FULLY }
        # Toute API (hors login) => JWT obligatoire
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        # Routes du site
        - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
